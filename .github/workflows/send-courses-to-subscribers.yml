name: Send Courses to Subscribers

on:
  schedule:
    # 09:00 GMT-4 = 13:00 UTC (GitHub Actions cron uses UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run send courses task
        env:
          DB_URL: ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.port.task.sendCoursesToSubcriptorsTask